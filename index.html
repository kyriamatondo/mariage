<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&J | 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garabond:ital,wght@1,300&family=Inter:wght@100;300;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Cormorant Garabond', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: { gold: '#A8894E', onyx: '#0A0A0A' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #000000; color: #FFFFFF; overflow-x: hidden; }
        
        .grid-line { border: 1px solid rgba(255, 255, 255, 0.05); }
        
        .btn-pro {
            background: #FFFFFF; color: #000000;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-pro:hover {
            background: #A8894E;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(168, 137, 78, 0.2);
        }

        .blur-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(20, 20, 20, 0.8) 0%, #000 100%);
            z-index: -1;
        }
    </style>
</head>
<body class="font-sans antialiased">
    <div class="blur-overlay"></div>

    <main class="min-h-screen flex flex-col p-6 md:p-12">
        
        <nav class="flex justify-between items-start w-full opacity-0 mb-20" id="nav">
            <div class="space-y-1">
                <p class="text-[10px] font-bold tracking-[0.3em] uppercase">Dina & Jaby</p>
                <p class="text-[9px] text-white/30 uppercase tracking-widest italic">Heureux mariage</p>
            </div>
            <div class="text-right">
                <p class="text-[10px] font-bold tracking-[0.3em] uppercase text-gold">13 Février 2026</p>
            </div>
        </nav>

        <div class="flex-grow flex flex-col justify-center max-w-5xl mx-auto w-full">
            
            <div class="grid grid-cols-1 md:grid-cols-12 gap-0 grid-line overflow-hidden rounded-sm opacity-0" id="main-bento">
                
                <div class="md:col-span-7 p-8 md:p-16 border-b md:border-b-0 md:border-r grid-line">
                    <h1 class="font-display text-6xl md:text-8xl italic leading-tight mb-8">
                        L'art de la <br><span class="text-gold">réception.</span>
                    </h1>
                    <p class="text-white/40 text-xs md:text-sm max-w-sm leading-relaxed font-light italic">
                        "Deux vies, une seule trajectoire. Nous vous invitons à partager notre première escale."
                    </p>
                </div>

                <div class="md:col-span-5 flex flex-col">
                    <div class="p-8 md:p-12 border-b grid-line flex-grow">
                        <div class="space-y-8">
                            <div class="flex justify-between items-center">
                                <span class="text-[10px] uppercase tracking-widest text-white/30">Salle</span>
                                <span class="text-xs font-semibold uppercase">Impérial Strong</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-[10px] uppercase tracking-widest text-white/30">Service</span>
                                <span class="text-xs font-semibold uppercase italic">Conciergerie</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="p-8 md:p-12 bg-onyx hover:bg-black transition-colors duration-500 cursor-pointer group" onclick="redirectToTally()">
                        <p class="text-white/40 text-[9px] uppercase tracking-[0.4em] mb-6 group-hover:text-gold transition-colors">Préférences de table</p>
                        <button class="btn-pro w-full py-6 text-[11px] font-bold uppercase tracking-[0.3em]">
                            Accéder à la carte
                        </button>
                    </div>
                </div>

            </div>
        </div>

        <footer class="mt-20 flex justify-between items-end opacity-0" id="footer">
            <div class="space-y-2">
                <p class="text-[8px] text-white/20 uppercase tracking-[0.5em]">Design by KM Agency</p>
            </div>
            <div class="flex space-x-4">
                <i data-lucide="instagram" class="w-3 h-3 text-white/20"></i>
                <i data-lucide="info" class="w-3 h-3 text-white/20"></i>
            </div>
        </footer>

    </main>

    <script src="index.js"></script>
</body>
</html>
