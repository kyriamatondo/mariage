<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dina & Jaby | L'Invitation</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Display:ital,wght@1,600&family=Plus+Jakarta+Sans:wght@200;400;800&display=swap');

        body { background-color: #000; color: #fff; margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        .font-display { font-family: 'Cormorant Display', serif; }

        /* BOUTON ROUGE FLASHY */
        .btn-impact {
            background-color: #FF2E2E !important;
            color: #fff !important;
            padding: 1.2rem 3rem;
            font-size: 1rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 40px rgba(255, 46, 46, 0.6);
            border: none;
            transition: all 0.4s ease;
            position: relative;
            z-index: 99;
        }

        .btn-impact:hover { 
            transform: scale(1.05); 
            background-color: #fff !important; 
            color: #000 !important;
            box-shadow: 0 0 50px #fff;
        }

        /* DESIGN DES LIGNES */
        .divider { width: 1px; height: 50px; background: linear-gradient(to bottom, #FF2E2E, transparent); margin: 0 auto; }

        /* SLIDER PHOTO RÉDUIT */
        .photo-viewport {
            width: 85%;
            max-width: 450px;
            aspect-ratio: 4/5;
            margin: 0 auto;
            position: relative;
            background: #0a0a0a;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .slide-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            filter: grayscale(100%);
        }

        .slide-img:first-child { opacity: 1; }

        /* ICÔNE SCROLL */
        .mouse-scroll {
            width: 20px; height: 35px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            position: relative;
            margin: 20px auto;
        }
        .mouse-scroll::before {
            content: '';
            width: 2px; height: 6px;
            background: #FF2E2E;
            position: absolute; top: 8px; left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
            animation: scroll-anim 2s infinite;
        }
        @keyframes scroll-anim {
            0% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, 15px); }
        }
    </style>
</head>
<body>

    <section class="h-screen flex flex-col items-center justify-center p-6 text-center relative">
        <h1 class="font-display text-7xl md:text-9xl italic mb-10">
            Dina <span class="text-[#FF2E2E]">&</span> Jaby
        </h1>

        <div class="space-y-8">
            <button onclick="redirectToTally()" class="btn-impact">
                Faire mon choix pour la boisson
            </button>
            
            <div class="pt-4">
                <div class="divider"></div>
                <div class="grid grid-cols-3 gap-8 max-w-sm mx-auto items-center mt-6">
                    <div><p class="text-[8px] text-white/30 uppercase">Date</p><p class="text-[10px] font-bold">13.02.26</p></div>
                    <div class="border-x border-white/10 px-2"><p class="text-[8px] text-white/30 uppercase">Lieu</p><p class="text-[10px] font-bold">CHAPITEAU IMPERIAL STRONG</p></div>
                    <div><p class="text-[8px] text-white/30 uppercase">Dress-code</p><p class="text-[10px] font-bold">BLACK AND CHIC</p></div>
                </div>
                <div class="mouse-scroll"></div>
            </div>
        </div>
    </section>

    <section class="py-24 px-6 text-center bg-[#050505]">
        <h2 class="font-display text-4xl italic text-[#FF2E2E] mb-10">L'Instant Présent</h2>

        <div class="photo-viewport shadow-2xl" id="slider">
            <img class="slide-img" src="images/15rec_-8.jpg.jpeg">
            <img class="slide-img" src="images/15rec_-2.jpg.jpeg">
            <img class="slide-img" src="images/15rec_-4.jpg.jpeg">
            <img class="slide-img" src="images/15rec_-3.jpg.jpeg">
            <img class="slide-img" src="images/15rec_-5.jpg.jpeg">
        </div>

        <p class="mt-10 text-[10px] tracking-[0.6em] uppercase text-white/20 italic">Chapiteau Impérial Strong</p>
    </section>

    <script>
        // 1. FONCTION DE REDIRECTION (Vérifiée)
        function redirectToTally() {
            // METS TON LIEN TALLY ICI ENTRE LES GUILLEMETS
            const TALLY_URL = "https://tally.so/r/eqR2gE"; 
            
            console.log("Redirection en cours...");
            window.location.href = TALLY_URL;
        }

        // 2. GESTION DU SLIDER ET DES EFFETS
        document.addEventListener('DOMContentLoaded', () => {
            const slides = document.querySelectorAll('.slide-img');
            let currentIndex = 0;

            if (slides.length > 0) {
                // Initialisation
                gsap.set(slides, { opacity: 0, filter: "grayscale(100%)" });
                gsap.set(slides[0], { opacity: 1 });

                function nextSlide() {
                    let nextIndex = (currentIndex + 1) % slides.length;
                    let currentImg = slides[currentIndex];
                    let nextImg = slides[nextIndex];

                    const tl = gsap.timeline();

                    // Transition : Couleur -> Fade Out -> Fade In Nouvelle -> NB
                    tl.to(currentImg, { filter: "grayscale(0%)", duration: 3, ease: "sine.inOut" })
                      .to(currentImg, { opacity: 0, duration: 2, ease: "power2.inOut" }, "+=2")
                      .to(nextImg, { opacity: 1, duration: 2, ease: "power2.inOut" }, "-=2")
                      .set(nextImg, { filter: "grayscale(100%)" });

                    currentIndex = nextIndex;
                }

                // Cycle de 10 secondes
                setInterval(nextSlide, 10000);

                // Zoom léger continu
                gsap.to(".slide-img", {
                    scale: 1.1,
                    duration: 15,
                    repeat: -1,
                    yoyo: true,
                    ease: "sine.inOut"
                });
            }
        });
    </script>

</body>
</html>
